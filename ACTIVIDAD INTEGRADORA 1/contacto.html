            <h2>Envíame un mensaje</h2>

            <!-- Formulario de contacto -->
         <form>
        <label for="nombre">Nombre:</label>
        <input type="text"
       id="nombre"
       name="nombre"
       required>

    <label for="correo">Correo electrónico:</label>
    <input type="email"
   id="correo"
  name="correo"
   required>

    <label for="mensaje">Mensaje:</label>
    <textarea id="mensaje"
  name="mensaje"
  rows="5"
  required></textarea>

    <button type="button">Enviar</button>
    </form>
